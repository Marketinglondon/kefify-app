<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kefify - Kefir, Bulgarian Cultures, Healthy</title>
<meta property="og:title" content="Kefify">
<meta property="og:description" content="Kefify catalog: kefir drinks, ice cream, desserts, cheese and butter">
<meta property="og:image" content="https://kefify.co.uk/assets/icon/Icon.png">
<meta property="og:type" content="website">
<link rel="icon" href="assets/icon/Icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f4f9f7; color: #1a1a1a; }

  header { background: white; color: black; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #eee; }
  .header-inner { max-width: 1100px; margin: 0 auto; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  header img { width: 44px; height: 44px; }
  header .titulos { text-align: left; }
  header h1 { font-size: 22px; letter-spacing: 1px; color: #000; }
  header p { font-size: 12px; color: #333; margin-top: 2px; }
  .btn-share-page { background: none; border: 1px solid #556B2F; color: #556B2F; padding: 8px 14px; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; }

  .hero { width: 100%; overflow: hidden; }
  .hero img { width: 100%; height: auto; display: block; max-height: 420px; object-fit: cover; object-position: center; }

  #splash { position: fixed; inset: 0; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; transition: opacity 0.8s; padding: 24px; text-align: center; }
  #splash img { width: 200px; margin-bottom: 30px; animation: pulse 3.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.75; transform: scale(1.04); } }
  #btnEntrar { background: linear-gradient(135deg, #556B2F, #8A9A5B); color: white; border: none; padding: 14px 32px; border-radius: 30px; font-size: 15px; font-weight: bold; letter-spacing: 0.5px; cursor: pointer; }

  .filtros { display: flex; gap: 8px; padding: 12px; overflow-x: auto; background: white; position: sticky; top: 0; z-index: 10; max-width: 1100px; margin: 0 auto; }
  .filtro-btn { padding: 8px 14px; border-radius: 20px; border: 1px solid #556B2F; background: white; color: #556B2F; white-space: nowrap; font-size: 13px; cursor: pointer; }
  .filtro-btn.activo { background: linear-gradient(135deg, #556B2F, #8A9A5B); color: white; border-color: #556B2F; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 12px; max-width: 1100px; margin: 0 auto; }
  .grid.transicionando { animation: fadeSlide 0.35s ease; }
  @keyframes fadeSlide {
    0% { opacity: 0; transform: translateX(20px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.08); position: relative; cursor: pointer; }
  .card img { width: 100%; height: 140px; object-fit: cover; }
  .card-body { padding: 10px; }
  .card-body h3 { font-size: 14px; margin-bottom: 4px; }
  .card-body .precio { color: #556B2F; font-weight: bold; font-size: 16px; }
  .card-body .stock { font-size: 11px; color: #888; margin-top: 4px; }

  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
  .modal.abierto { display: flex; }
  .modal-content { background: white; border-radius: 12px; max-width: 400px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal-content img { width: 100%; height: 260px; object-fit: cover; }
  .modal-body { padding: 16px; }
  .modal-body h2 { margin-bottom: 8px; }
  .btn-whatsapp { display: block; background: #25D366; color: white; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; margin-top: 12px; font-weight: bold; }
  .btn-share-product { display: block; background: white; color: #556B2F; text-align: center; padding: 12px; border-radius: 8px; border: 1px solid #556B2F; margin-top: 10px; font-weight: bold; cursor: pointer; width: 100%; }
  .btn-cerrar { display: block; text-align: center; padding: 10px; color: #888; cursor: pointer; }
  .vacio { text-align: center; padding: 40px; color: #888; grid-column: 1 / -1; }

  /* Tablet y PC: se activan automaticamente solo cuando la pantalla es ancha */
  @media (min-width: 700px) {
    .grid { grid-template-columns: repeat(4, 1fr); gap: 18px; padding: 24px 12px; }
    header { padding: 20px 24px; }
    .filtros { padding: 16px 12px; justify-content: center; }
  }
  @media (min-width: 1100px) {
    .grid { grid-template-columns: repeat(5, 1fr); }
  }
</style>
</head>
<body>

<div id="splash">
  <img src="assets/icon/Icon.png" alt="Kefify">
  <button id="btnEntrar" onclick="entrarCatalogo()">Discover your balance</button>
</div>

<header>
  <div class="header-inner">
    <div class="header-left">
      <img src="assets/icon/Logo.png" alt="Kefify">
      <div class="titulos">
        <h1>KEFIFY</h1>
        <p>KEFIR | BULGARIAN CULTURES | HEALTHY</p>
      </div>
    </div>
    <button class="btn-share-page" onclick="compartirPagina()">Share</button>
  </div>
</header>

<div class="hero">
  <img src="assets/icon/hero-full.png" alt="Kefify - Nutrition and quality for every moment">
</div>

<div class="filtros" id="filtros"></div>
<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <img id="modalImg" src="" alt="">
    <div class="modal-body">
      <h2 id="modalNombre"></h2>
      <p id="modalDesc" style="color:#666; font-size:14px; margin-top:6px;"></p>
      <p class="precio" id="modalPrecio" style="font-size:20px; margin-top:10px;"></p>
      <a href="#" id="modalWhatsapp" class="btn-whatsapp" target="_blank">Ask on WhatsApp</a>
      <button class="btn-share-product" onclick="compartirProducto()">Share this product</button>
      <div class="btn-cerrar" onclick="cerrarModal()">Close</div>
    </div>
  </div>
</div>

<script>
const PROJECT_ID = 'kefify-86360';
const WHATSAPP_NUMBER = '447446830987';
const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/productos`;
const SITE_URL = 'https://kefify.co.uk/';

const CATEGORIAS_FIJAS = ['Artisanal Dairy', 'Ice Cream', 'Yogurt', 'Desserts', 'Drinks'];

let productos = [];
let categoriaActiva = 'Artisanal Dairy';
let productoActual = null;

function entrarCatalogo() {
  const splash = document.getElementById('splash');
  splash.style.opacity = '0';
  setTimeout(() => splash.style.display = 'none', 800);
}

function parseFirestoreDoc(doc) {
  const f = doc.fields || {};
  const getStr = (k) => f[k]?.stringValue || '';
  const getNum = (k) => f[k]?.doubleValue ?? f[k]?.integerValue ?? 0;
  const getBool = (k) => f[k]?.booleanValue ?? true;
  const getArr = (k) => (f[k]?.arrayValue?.values || []).map(v => v.stringValue);
  return {
    id: doc.name.split('/').pop(),
    nombre: getStr('nombre'),
    categoria: getStr('categoria'),
    sabor: getStr('sabor'),
    presentacion: getStr('presentacion'),
    precioVenta: parseFloat(getNum('precioVenta')),
    enStock: getBool('enStock'),
    fotos: getArr('fotos'),
    descripcion: getStr('descripcion'),
  };
}

async function cargarProductos() {
  try {
    const res = await fetch(FIRESTORE_URL);
    const data = await res.json();
    productos = (data.documents || []).map(parseFirestoreDoc);
    renderFiltros();
    renderGrid();
  } catch (e) {
    document.getElementById('grid').innerHTML = '<p class="vacio">Could not load the catalog. Please try again.</p>';
  }
}

function renderFiltros() {
  const cont = document.getElementById('filtros');
  cont.innerHTML = CATEGORIAS_FIJAS.map(c =>
    `<button class="filtro-btn ${c === categoriaActiva ? 'activo' : ''}" onclick="filtrar('${c}')">${c}</button>`
  ).join('');
}

function filtrar(cat) {
  if (cat === categoriaActiva) return;
  categoriaActiva = cat;
  renderFiltros();
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const lista = productos.filter(p => p.categoria === categoriaActiva);

  if (lista.length === 0) {
    grid.innerHTML = '<p class="vacio">No products in this category yet.</p>';
  } else {
    grid.innerHTML = lista.map((p, i) => `
      <div class="card" onclick="abrirModal(${productos.indexOf(p)})">
        <img src="${p.fotos[0] || ''}" alt="${p.nombre}" onerror="this.style.display='none'">
        <div class="card-body">
          <h3>${p.nombre}</h3>
          <div class="precio">£${p.precioVenta.toFixed(0)}</div>
          <div class="stock">${p.enStock ? 'In stock' : 'Out of stock'}</div>
        </div>
      </div>
    `).join('');
  }

  grid.classList.remove('transicionando');
  void grid.offsetWidth;
  grid.classList.add('transicionando');
}

function abrirModal(index) {
  const p = productos[index];
  productoActual = p;
  document.getElementById('modalImg').src = p.fotos[0] || '';
  document.getElementById('modalNombre').textContent = p.nombre;
  document.getElementById('modalDesc').textContent =
    [p.sabor, p.presentacion, p.descripcion].filter(Boolean).join(' | ');
  document.getElementById('modalPrecio').textContent = '£' + p.precioVenta.toFixed(0);
  const mensaje = encodeURIComponent(`Hi, I'm interested in this product: ${p.nombre}`);
  document.getElementById('modalWhatsapp').href = `https://wa.me/${WHATSAPP_NUMBER}?text=${mensaje}`;
  document.getElementById('modal').classList.add('abierto');
}

function cerrarModal() {
  document.getElementById('modal').classList.remove('abierto');
}

async function compartirPagina() {
  const shareData = {
    title: 'Kefify',
    text: 'Check out the Kefify catalog: kefir drinks, ice cream, desserts, cheese and butter',
    url: SITE_URL
  };
  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else {
      await navigator.clipboard.writeText(SITE_URL);
      alert('Link copied to clipboard!');
    }
  } catch (e) {}
}

async function compartirProducto() {
  if (!productoActual) return;
  const p = productoActual;
  const shareData = {
    title: p.nombre,
    text: `${p.nombre} - £${p.precioVenta.toFixed(0)}`,
    url: SITE_URL
  };
  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else {
      await navigator.clipboard.writeText(`${p.nombre} - £${p.precioVenta.toFixed(0)} - ${SITE_URL}`);
      alert('Product info copied to clipboard!');
    }
  } catch (e) {}
}

cargarProductos();
</script>
</body>
</html>
