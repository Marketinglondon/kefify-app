<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kefify - Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f4f9f7; color: #1a1a1a; padding-bottom: 40px; }
  header { background: #556B2F; color: white; padding: 16px; text-align: center; }
  header h1 { font-size: 20px; }
  .container { max-width: 600px; margin: 0 auto; padding: 16px; }
  .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; margin-top: 12px; }
  input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
  textarea { resize: vertical; min-height: 60px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .switch-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  button { cursor: pointer; }
  .btn-primary { width: 100%; background: #556B2F; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 18px; }
  .btn-secondary { background: white; color: #556B2F; border: 1px solid #556B2F; padding: 8px 14px; border-radius: 8px; font-size: 13px; }
  .fotos-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .fotos-preview img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; }
  .lista-item { background: white; border-radius: 10px; padding: 10px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .lista-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; }
  .lista-item .info { flex: 1; }
  .lista-item .info h4 { font-size: 14px; }
  .lista-item .info p { font-size: 12px; color: #888; }
  .lista-item .acciones { display: flex; gap: 6px; }
  .lista-item button { border: none; background: #eee; padding: 6px 10px; border-radius: 6px; font-size: 12px; }
  .estado { text-align: center; padding: 10px; font-size: 13px; color: #556B2F; }
  #loginBox { max-width: 320px; margin: 80px auto; text-align: center; }
  #loginBox input { margin-top: 12px; }
  #loginBox button { margin-top: 14px; }
  .campo-traduciendo { position: relative; }
  .spinner-mini { display: inline-block; width: 12px; height: 12px; border: 2px solid #ccc; border-top-color: #556B2F; border-radius: 50%; animation: girar 0.7s linear infinite; margin-left: 6px; vertical-align: middle; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .idioma-tag { display: inline-block; font-size: 11px; background: #f0f4e8; color: #556B2F; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
</style>
</head>
<body>

<div id="loginBox">
  <h2>Kefify Admin</h2>
  <p style="margin-top:8px; font-size:13px; color:#666;">Ingresa el código de acceso</p>
  <input type="password" id="codigoAcceso" placeholder="Código">
  <button class="btn-primary" onclick="verificarCodigo()">Entrar</button>
</div>

<div id="panel" style="display:none;">
<header><h1>Kefify - Administrar productos</h1></header>
<div class="container">

  <div class="card">
    <h3 id="formTitulo">Nuevo producto</h3>
    <input type="hidden" id="productoId">

    <label>Fotos</label>
    <input type="file" id="fotosInput" accept="image/*" multiple>
    <div class="fotos-preview" id="fotosPreview"></div>

    <label>Nombre <span class="idioma-tag">Inglés</span></label>
    <input type="text" id="nombre">

    <label>Nombre <span class="idioma-tag">Español</span> <span id="spinnerNombre" style="display:none;" class="spinner-mini"></span></label>
    <input type="text" id="nombreEs" placeholder="Se autocompleta al salir del campo de arriba">

    <label>Código (opcional)</label>
    <input type="text" id="codigo">

    <label>Categoría</label>
    <select id="categoria">
      <option value="Drinks">Drinks</option>
      <option value="Yogurt">Yogurt</option>
      <option value="Desserts">Desserts</option>
      <option value="Ice Cream">Ice Cream</option>
      <option value="Artisanal Dairy">Artisanal Dairy</option>
    </select>

    <div class="row">
      <div>
        <label>Sabor</label>
        <input type="text" id="sabor">
      </div>
      <div>
        <label>Presentación</label>
        <input type="text" id="presentacion">
      </div>
    </div>

    <label>Descripción <span class="idioma-tag">Inglés</span></label>
    <textarea id="descripcion"></textarea>

    <label>Descripción <span class="idioma-tag">Español</span> <span id="spinnerDesc" style="display:none;" class="spinner-mini"></span></label>
    <textarea id="descripcionEs" placeholder="Se autocompleta al salir del campo de arriba"></textarea>

    <div class="row">
      <div>
        <label>Costo proveedor (£)</label>
        <input type="number" id="costoProveedor">
      </div>
      <div>
        <label>Precio venta UK (£)</label>
        <input type="number" id="precioVenta">
      </div>
    </div>

    <label>Precio venta Colombia ($ COP)</label>
    <input type="number" id="precioVentaCOP">

    <div class="switch-row">
      <input type="checkbox" id="enStock" checked style="width:auto;">
      <label style="margin:0;">En stock</label>
    </div>

    <label>Nombre del proveedor</label>
    <input type="text" id="proveedorNombre">

    <label>WhatsApp del proveedor</label>
    <input type="text" id="proveedorWhatsapp">

    <button class="btn-primary" onclick="guardarProducto()">Guardar producto</button>
    <div class="estado" id="estado"></div>
    <button class="btn-secondary" style="margin-top:10px; width:100%;" onclick="limpiarFormulario()">Cancelar / Nuevo producto</button>
  </div>

  <div class="card">
    <h3>Productos existentes</h3>
    <div id="listaProductos"></div>
  </div>

</div>
</div>

<script>
const CODIGO_ACCESO = 'kefify2026';
const PROJECT_ID = 'kefify-86360';
const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/productos`;
const CLOUDINARY_CLOUD = 'iggcl810';
const CLOUDINARY_PRESET = 'kefify_preset';
const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`;

let fotosSubidas = [];
let editandoId = null;
let productosCache = [];

function verificarCodigo() {
  const val = document.getElementById('codigoAcceso').value;
  if (val === CODIGO_ACCESO) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    cargarLista();
  } else {
    alert('Código incorrecto');
  }
}

async function traducirTexto(texto) {
  if (!texto) return '';
  try {
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(texto)}&langpair=en|es`);
    const data = await res.json();
    return data.responseData?.translatedText || '';
  } catch (e) {
    return '';
  }
}

document.getElementById('nombre').addEventListener('blur', async () => {
  const origen = document.getElementById('nombre').value.trim();
  const destino = document.getElementById('nombreEs');
  if (!origen || destino.value.trim()) return;
  document.getElementById('spinnerNombre').style.display = 'inline-block';
  destino.value = await traducirTexto(origen);
  document.getElementById('spinnerNombre').style.display = 'none';
});

document.getElementById('descripcion').addEventListener('blur', async () => {
  const origen = document.getElementById('descripcion').value.trim();
  const destino = document.getElementById('descripcionEs');
  if (!origen || destino.value.trim()) return;
  document.getElementById('spinnerDesc').style.display = 'inline-block';
  destino.value = await traducirTexto(origen);
  document.getElementById('spinnerDesc').style.display = 'none';
});

document.getElementById('fotosInput').addEventListener('change', async (e) => {
  const archivos = Array.from(e.target.files);
  const estado = document.getElementById('estado');
  estado.textContent = 'Subiendo fotos...';
  for (const archivo of archivos) {
    const formData = new FormData();
    formData.append('file', archivo);
    formData.append('upload_preset', CLOUDINARY_PRESET);
    try {
      const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
      const data = await res.json();
      if (data.secure_url) {
        fotosSubidas.push(data.secure_url);
        renderFotosPreview();
      }
    } catch (err) {
      estado.textContent = 'Error subiendo una foto';
    }
  }
  estado.textContent = '';
});

function renderFotosPreview() {
  const cont = document.getElementById('fotosPreview');
  cont.innerHTML = fotosSubidas.map((url, i) =>
    `<div style="position:relative;">
      <img src="${url}">
      <button onclick="quitarFoto(${i})" style="position:absolute; top:-6px; right:-6px; background:#c00; color:white; border:none; border-radius:50%; width:20px; height:20px; font-size:11px;">×</button>
    </div>`
  ).join('');
}

function quitarFoto(i) {
  fotosSubidas.splice(i, 1);
  renderFotosPreview();
}

function toFirestoreFields(obj) {
  const fields = {};
  for (const key in obj) {
    const val = obj[key];
    if (typeof val === 'string') fields[key] = { stringValue: val };
    else if (typeof val === 'number') fields[key] = { doubleValue: val };
    else if (typeof val === 'boolean') fields[key] = { booleanValue: val };
    else if (Array.isArray(val)) fields[key] = { arrayValue: { values: val.map(v => ({ stringValue: v })) } };
  }
  return fields;
}

function fromFirestoreDoc(doc) {
  const f = doc.fields || {};
  const getStr = (k) => f[k]?.stringValue || '';
  const getNum = (k) => parseFloat(f[k]?.doubleValue ?? f[k]?.integerValue ?? 0);
  const getBool = (k) => f[k]?.booleanValue ?? true;
  const getArr = (k) => (f[k]?.arrayValue?.values || []).map(v => v.stringValue);
  return {
    id: doc.name.split('/').pop(),
    nombre: getStr('nombre'), nombreEs: getStr('nombreEs'),
    codigo: getStr('codigo'), categoria: getStr('categoria'),
    sabor: getStr('sabor'), presentacion: getStr('presentacion'),
    descripcion: getStr('descripcion'), descripcionEs: getStr('descripcionEs'),
    costoProveedor: getNum('costoProveedor'), precioVenta: getNum('precioVenta'), precioVentaCOP: getNum('precioVentaCOP'),
    enStock: getBool('enStock'), fotos: getArr('fotos'),
    proveedorNombre: getStr('proveedorNombre'), proveedorWhatsapp: getStr('proveedorWhatsapp'),
    fechaCreacion: getStr('fechaCreacion')
  };
}

async function guardarProducto() {
  const estado = document.getElementById('estado');
  const nombre = document.getElementById('nombre').value.trim();
  if (!nombre) { estado.textContent = 'Escribe el nombre del producto'; return; }

  const datos = {
    nombre,
    nombreEs: document.getElementById('nombreEs').value.trim(),
    codigo: document.getElementById('codigo').value.trim(),
    categoria: document.getElementById('categoria').value,
    sabor: document.getElementById('sabor').value.trim(),
    presentacion: document.getElementById('presentacion').value.trim(),
    descripcion: document.getElementById('descripcion').value.trim(),
    descripcionEs: document.getElementById('descripcionEs').value.trim(),
    costoProveedor: parseFloat(document.getElementById('costoProveedor').value) || 0,
    precioVenta: parseFloat(document.getElementById('precioVenta').value) || 0,
    precioVentaCOP: parseFloat(document.getElementById('precioVentaCOP').value) || 0,
    enStock: document.getElementById('enStock').checked,
    fotos: fotosSubidas,
    proveedorNombre: document.getElementById('proveedorNombre').value.trim(),
    proveedorWhatsapp: document.getElementById('proveedorWhatsapp').value.trim(),
    fechaCreacion: new Date().toISOString()
  };

  estado.textContent = 'Guardando...';
  try {
    const fields = toFirestoreFields(datos);
    if (editandoId) {
      const mask = Object.keys(datos).map(k => `updateMask.fieldPaths=${k}`).join('&');
      const res = await fetch(`${FIRESTORE_URL}/${editandoId}?${mask}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields })
      });
      if (!res.ok) throw new Error();
      estado.textContent = 'Producto actualizado';
    } else {
      const res = await fetch(FIRESTORE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields })
      });
      if (!res.ok) throw new Error();
      estado.textContent = 'Producto guardado';
    }
    limpiarFormulario();
    cargarLista();
  } catch (e) {
    estado.textContent = 'Error al guardar. Intenta de nuevo.';
  }
}

function limpiarFormulario() {
  editandoId = null;
  fotosSubidas = [];
  renderFotosPreview();
  document.getElementById('formTitulo').textContent = 'Nuevo producto';
  ['nombre','nombreEs','codigo','sabor','presentacion','descripcion','descripcionEs','costoProveedor','precioVenta','precioVentaCOP','proveedorNombre','proveedorWhatsapp'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('categoria').value = 'Drinks';
  document.getElementById('enStock').checked = true;
  document.getElementById('estado').textContent = '';
}

async function cargarLista() {
  const cont = document.getElementById('listaProductos');
  cont.innerHTML = 'Cargando...';
  try {
    const res = await fetch(FIRESTORE_URL);
    const data = await res.json();
    productosCache = (data.documents || []).map(fromFirestoreDoc);
    if (productosCache.length === 0) {
      cont.innerHTML = '<p style="color:#888; font-size:13px;">No hay productos todavía.</p>';
      return;
    }
    cont.innerHTML = productosCache.map(p => `
      <div class="lista-item">
        <img src="${p.fotos[0] || ''}" onerror="this.style.display='none'">
        <div class="info">
          <h4>${p.nombre}</h4>
          <p>${p.categoria} · £${p.precioVenta} · ${p.enStock ? 'En stock' : 'Agotado'}</p>
        </div>
        <div class="acciones">
          <button onclick="editarProducto('${p.id}')">Editar</button>
          <button onclick="eliminarProducto('${p.id}')">Eliminar</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    cont.innerHTML = '<p style="color:#c00;">Error cargando productos</p>';
  }
}

function editarProducto(id) {
  const p = productosCache.find(x => x.id === id);
  if (!p) return;
  editandoId = id;
  fotosSubidas = [...p.fotos];
  renderFotosPreview();
  document.getElementById('formTitulo').textContent = 'Editar producto';
  document.getElementById('nombre').value = p.nombre;
  document.getElementById('nombreEs').value = p.nombreEs;
  document.getElementById('codigo').value = p.codigo;
  document.getElementById('categoria').value = p.categoria;
  document.getElementById('sabor').value = p.sabor;
  document.getElementById('presentacion').value = p.presentacion;
  document.getElementById('descripcion').value = p.descripcion;
  document.getElementById('descripcionEs').value = p.descripcionEs;
  document.getElementById('costoProveedor').value = p.costoProveedor;
  document.getElementById('precioVenta').value = p.precioVenta;
  document.getElementById('precioVentaCOP').value = p.precioVentaCOP;
  document.getElementById('enStock').checked = p.enStock;
  document.getElementById('proveedorNombre').value = p.proveedorNombre;
  document.getElementById('proveedorWhatsapp').value = p.proveedorWhatsapp;
  window.scrollTo(0, 0);
}

async function eliminarProducto(id) {
  if (!confirm('¿Eliminar este producto?')) return;
  try {
    await fetch(`${FIRESTORE_URL}/${id}`, { method: 'DELETE' });
    cargarLista();
  } catch (e) {
    alert('Error al eliminar');
  }
}
</script>
</body>
</html>
